<!-- --------------------------------------------------- --------------- category details ---------------------------------------------------- --------------- -->

<section class="p-4 md:p-8">
  <div class="container max-w-3xl rounded mt-4">
    <div class="flex flex-col items-center text-center gap-4 sm:gap-6 shadow-xl p-5">
      <!-- 1) badge -->
      <span
        class="bg-emerald-50 text-emerald-600 text-xs px-2.5 py-1 rounded-full font-medium"
        >{{ categoryList().name }}</span
      >

      <!-- 2) image -->
      <div
        class="w-full max-w-xs sm:max-w-md lg:max-w-lg bg-gray-50 rounded-2xl overflow-hidden border border-gray-100 shadow-sm"
      >
        <img
          [src]="categoryList().image"
          [alt]="categoryList().name"
          class="w-full aspect-[4/3] object-cover"
        />
      </div>

      <!-- 3) name -->
      <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold text-slate-900">
        {{ categoryList().name }}
      </h1>

      <!-- 4) two buttons side by side -->
      <div class="flex flex-row gap-3 w-full max-w-xs sm:max-w-md">
        <button
          class="flex-1 cursor-pointer bg-secondary text-white font-bold py-3 sm:py-3.5 px-2 rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-emerald-100 text-sm sm:text-base"
        >
          <i class="fas fa-shopping-bag"></i> Shop Now
        </button>
        <button
          class="flex-1 cursor-pointer border border-gray-200 py-3 sm:py-3 rounded-xl font-bold text-gray-700 hover:bg-gray-50 transition-all text-sm sm:text-base"
        >
          <i class="fas fa-th-large"></i> All Categories
        </button>
      </div>
    </div>
  </div>
</section>
